<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="product_title">Product - Topone Mechanical Manufacturing</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/i18n.css">
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container">
            <div class="top-links">
                <a href="#" data-i18n="set_homepage">Set Homepage</a>
                <span>|</span>
                <a href="#" data-i18n="favorite">Favorite</a>
            </div>
            <div class="lang-switch">
                <a href="#" data-lang-switch="en" data-i18n="lang_en">English</a>
                <span>|</span>
                <a href="#" data-lang-switch="cn" data-i18n="lang_cn">中文</a>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="img/logo.png" alt="Topone Logo">
                <div class="logo-text">
                    <h1 data-i18n="company_name_cn">拓丰机械制造</h1>
                    <p data-i18n="company_name_en">Topone Mechanical Manufacturing</p>
                </div>
            </div>
            <div class="contact-info">
                <div class="phone-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </div>
                <div class="phone-info">
                    <span class="tel-label" data-i18n="tel">TEL</span>
                    <span class="tel-number">+86 18052834640</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="main-nav">
        <div class="container">
            <ul class="nav-list">
                <li><a href="index.html" data-i18n="nav_home">Home</a></li>
                <li><a href="about.html" data-i18n="nav_about">About</a></li>
                <li class="active"><a href="product.html" data-i18n="nav_product">Product</a></li>
                <li><a href="equipment.html" data-i18n="nav_equipment">Equipment</a></li>
                <li><a href="partnership.html" data-i18n="nav_partnership">Partnership</a></li>
                <li><a href="contact.html" data-i18n="nav_contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Banner -->
    <div class="page-banner product-banner">
        <div class="container">
            <img src="img/product/banner.jpg" alt="Gears">
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="product-layout">
                <!-- Sidebar Filter -->
                <aside class="filter-sidebar">
                    <h3 class="filter-title" data-i18n="product_filter">Filter</h3>
                    <nav class="filter-nav" id="filter-nav">
                        <!-- Filter links will be loaded dynamically -->
                    </nav>
                </aside>

                <!-- Product Showcase -->
                <div class="product-showcase">
                    <h3 class="showcase-title" data-i18n="product_showcase">Product Showcase</h3>
                    <div class="product-grid" id="product-grid">
                        <!-- Products will be loaded dynamically -->
                    </div>

                    <!-- Pagination -->
                    <div class="pagination">
                        <a href="#" class="page-link" data-i18n="product_prev">Prev</a>
                        <a href="#" class="page-link active">1</a>
                        <a href="#" class="page-link">2</a>
                        <a href="#" class="page-link">3</a>
                        <a href="#" class="page-link">4</a>
                        <a href="#" class="page-link" data-i18n="product_next">Next</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p data-i18n="copyright">&copy;2026 Topone Mechanical Manufacturing copyright</p>
            <a href="#" class="login-link" data-i18n="login">Login</a>
        </div>
    </footer>

    <!-- Product Data -->
    <script src="js/product.js"></script>
    <!-- i18n Script -->
    <script src="js/i18n.js"></script>
    <script>
        // Pagination state
        let currentPage = 1;
        const itemsPerPage = 9;
        let totalPages = 1;

        // Render filter navigation
        function renderFilterNav() {
            const filterNav = document.getElementById('filter-nav');
            const categories = ProductData.utils.getAllCategories();
            const currentLang = I18n.getCurrentLang();
            
            filterNav.innerHTML = categories.map((category, index) => {
                const categoryName = ProductData.utils.getCategoryName(category, currentLang);
                return `<a href="product-category.html?category=${category.id}" class="filter-link ${index === 0 ? 'active' : ''}">${categoryName}</a>`;
            }).join('');
        }

        // Render product grid
        function renderProductGrid() {
            const productGrid = document.getElementById('product-grid');
            const products = ProductData.utils.getAllProducts();
            const currentLang = I18n.getCurrentLang();
            
            // Calculate pagination
            totalPages = Math.ceil(products.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const displayProducts = products.slice(startIndex, endIndex);
            
            productGrid.innerHTML = displayProducts.map(product => {
                const productName = ProductData.utils.getProductName(product, currentLang);
                return `
                    <a href="product-detail.html?id=${product.id}" class="product-item">
                        <div class="product-image">
                            <img src="${product.coverImage}" alt="${productName}">
                        </div>
                        <p class="product-name">${productName}</p>
                    </a>
                `;
            }).join('');
            
            // Render pagination
            renderPagination();
        }

        // Render pagination
        function renderPagination() {
            const pagination = document.querySelector('.pagination');
            const currentLang = I18n.getCurrentLang();
            const prevText = currentLang === 'cn' ? '上一页' : 'Prev';
            const nextText = currentLang === 'cn' ? '下一页' : 'Next';
            
            let paginationHTML = `<a href="#" class="page-link prev-link" data-page="prev">${prevText}</a>`;
            
            for (let i = 1; i <= totalPages; i++) {
                paginationHTML += `<a href="#" class="page-link page-num ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</a>`;
            }
            
            paginationHTML += `<a href="#" class="page-link next-link" data-page="next">${nextText}</a>`;
            pagination.innerHTML = paginationHTML;
            
            // Add click events
            pagination.querySelectorAll('.page-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page;
                    
                    if (page === 'prev') {
                        if (currentPage > 1) {
                            currentPage--;
                            renderProductGrid();
                        }
                    } else if (page === 'next') {
                        if (currentPage < totalPages) {
                            currentPage++;
                            renderProductGrid();
                        }
                    } else {
                        currentPage = parseInt(page);
                        renderProductGrid();
                    }
                });
            });
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            renderFilterNav();
            renderProductGrid();
        });

        // Re-render when language changes
        document.addEventListener('languageChanged', function() {
            renderFilterNav();
            renderProductGrid();
        });
    </script>
</body>
</html>
